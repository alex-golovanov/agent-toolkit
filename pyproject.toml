[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["local", "corpora", "profiles", "exports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
